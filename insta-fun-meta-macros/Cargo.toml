[package]
name = "insta-fun-meta-macros"
version = "0.1.0"
edition = "2024"
description = "Proc macros for insta-fun metadata dashboard snapshots"
license = "Unlicense"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }
proc-macro-crate = "3"

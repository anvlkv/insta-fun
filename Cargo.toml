[package]
name = "insta-fun"
version = "2.4.0"
edition = "2024"
description = "Snapshot testing of fundsp units. Visualize output in svg and compare using insta"
repository = "https://github.com/anvlkv/insta-fun"
license = "Unlicense"
keywords = ["fundsp", "insta", "plotters", "testing", "visualization"]

[workspace]
members = ["insta-fun-meta-macros"]
resolver = "2"

[[example]]
name = "filters"

[[example]]
name = "oscillators"

[[example]]
name = "time_fx_and_noise"

[[example]]
name = "filters_advanced"

[[example]]
name = "oscillators_advanced"

[[example]]
name = "modulation_and_control"

[[example]]
name = "utility_shaping_rate"

[dependencies]
derive_builder = "0.20.2"
fundsp = { version = "0.23", default-features = false, features = ["std"] }
petgraph = { version = "0.8.3", optional = true }
insta-fun-meta-macros = { path = "insta-fun-meta-macros" }
plotters = { version = "0.3.7", default-features = false, features = [
  "area_series",
  "line_series",
  "point_series",
  "svg_backend"
] }

[dev-dependencies]
insta = "1.47"

[features]
default = []
dot = ["dep:petgraph"]
